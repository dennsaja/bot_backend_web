<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Telegram Realtime Viewer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial; margin: 0; background:#0b1220; color:#e6eef8; }
    header { padding: 18px; background:#061025; border-bottom:1px solid rgba(255,255,255,0.03); }
    h1 { margin:0; font-size:18px; }
    #chat { padding: 16px; max-width:900px; margin: 12px auto; }
    .msg { background:#071427; padding:12px; border-radius:10px; margin-bottom:10px; box-shadow:0 2px 6px rgba(0,0,0,0.4); }
    .meta { font-size:12px; color:#7fb0d9; }
    .text { margin-top:6px; font-size:15px; color:#dcefff; white-space:pre-wrap; }
    #status { font-size:13px; color:#9fbddc; margin-left:8px; }
  </style>
</head>
<body>
  <header>
    <h1>Telegram Realtime Viewer <span id="status">(connecting...)</span></h1>
  </header>

  <div id="chat"></div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const chatEl = document.getElementById("chat");
    const statusEl = document.getElementById("status");

    // Connect to same host
    const socket = io();

    function addMessage(payload) {
      const div = document.createElement("div");
      div.className = "msg";

      const date = new Date((payload.date || (Date.now()/1000)) * 1000);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerText = `${payload.from} · ${payload.chat_title || payload.chat_id} · ${date.toLocaleString()}`;
      const text = document.createElement("div");
      text.className = "text";
      text.innerHTML = payload.text || "<i>(media or empty)</i>";

      div.appendChild(meta);
      div.appendChild(text);

      chatEl.insertBefore(div, chatEl.firstChild);

      // keep max messages
      const msgs = chatEl.querySelectorAll(".msg");
      if (msgs.length > 200) msgs[msgs.length - 1].remove();
    }

    socket.on("connect", () => {
      statusEl.innerText = "(connected)";
      console.log("Connected to socket:", socket.id);
    });

    socket.on("disconnect", () => {
      statusEl.innerText = "(disconnected)";
      console.log("Disconnected from socket");
    });

    socket.on("telegram_message", (payload) => {
      addMessage(payload);
    });

    // optional ping
    setInterval(()=> {
      if (socket.connected) socket.emit("ping_server", (res) => {
        // console.log("pong", res);
      });
    }, 20000);
  </script>
</body>
</html>
